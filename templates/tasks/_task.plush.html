<li class="task<%= if (task.Completed) { %> task-completed<% } %>">
  <form action="/tasks/<%= task.ID %>/toggle" method="POST" class="task-toggle" data-task-toggle>
    <input type="hidden" name="authenticity_token" value="<%= authenticity_token %>">
    <input type="hidden" name="_method" value="PUT">
    <%= if (fromMatrix) { %><input type="hidden" name="return_to" value="/matrix"><% } %>
    <button
      type="submit"
      class="task-toggle-button"
      aria-pressed="<%= if (task.Completed) { %>true<% } else { %>false<% } %>"
      aria-label="<%= if (task.Completed) { %>Reabrir<% } else { %>Completar<% } %> tarea: <%= task.Title %>"
      title="<%= if (task.Completed) { %>Reabrir<% } else { %>Completar<% } %> tarea"
    >
      <span class="completion-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 12 4 4 8-8" /></svg>
      </span>
      <span class="toggle-label sr-only"><%= if (task.Completed) { %>Reabrir<% } else { %>Completar<% } %></span>
    </button>
  </form>
  <span class="task-title"><%= task.Title %></span>
  <%= if (task.Completed) { %>
    <span class="task-status">Completada</span>
  <% } %>
  <div class="task-actions">
    <a href="/tasks/<%= task.ID %>/edit<%= if (fromMatrix) { %>?return_to=/matrix<% } %>" class="icon-action" aria-label="Editar tarea: <%= task.Title %>" title="Editar tarea">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15l-1 6Z" />
      </svg>
    </a>
    <form action="/tasks/<%= task.ID %>" method="POST" data-confirm="¿Seguro que quieres eliminar esta tarea?">
      <input type="hidden" name="authenticity_token" value="<%= authenticity_token %>">
      <input type="hidden" name="_method" value="DELETE">
      <%= if (fromMatrix) { %><input type="hidden" name="return_to" value="/matrix"><% } %>
      <button type="submit" class="icon-action icon-danger" aria-label="Eliminar tarea: <%= task.Title %>" title="Eliminar tarea">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5" />
        </svg>
      </button>
    </form>
  </div>
</li>
